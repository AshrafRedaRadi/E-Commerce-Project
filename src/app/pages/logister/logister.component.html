<!--this is header-->
<header>
  <div>
    <h1>Register</h1>
    <a routerLink="/">Home</a> - <a routerLink="/logister">Register</a>
  </div>
</header>
<section class="login">
  <div class="new">
    <h3>Already have an account?</h3>
    <p>
      There are advances being made in science and technology everyday, and a
      good example of this is the
    </p>
    <a routerLink="/login-logister">Login Now</a>
  </div>
  <div class="form">
    <h4>CREATE AN ACCOUNT</h4>
    <form action="">
      <div class="div1">
        <input type="text" name="user name" placeholder="Username" />
      </div>
      <div class="div1">
        <input type="email" name="email" placeholder="Email Address" />
      </div>
      <div class="div1">
        <input type="pass" name="password" placeholder="Password" />
      </div>
      <div class="div1">
        <input
          type="pass"
          name="confirm password"
          placeholder="Confirm Password"
        />
      </div>
      <div class="div2">
        <input type="checkbox" name="keep me logged in" id="keep" />
        <label for="keep">Keep me logged in</label>
      </div>
      <div class="div3">
        <input type="submit" name="register" value="REGISTER" />
      </div>
    </form>
  </div>
</section>
